name: Automated Keeper Trigger

on:
  schedule:
    # Run every 10 minutes 24/7
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-keeper:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Blindpot Autonomous Keeper API
        run: |
          echo "Pinging Blindpot keeper endpoint on Vercel..."
          curl -s -X GET https://blindpot.vercel.app/api/keeper
